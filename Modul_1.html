<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modul 1 - RNS</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --bg-body: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background-color: var(--bg-body); 
      color: var(--text-main);
      padding: 30px 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .back-nav { 
      display: inline-flex; 
      align-items: center; 
      gap: 8px;
      margin-bottom: 24px; 
      color: var(--primary); 
      text-decoration: none; 
      font-weight: 600;
      font-size: 0.9rem;
      padding: 8px 14px;
      border-radius: 8px;
      background: #eff6ff;
      transition: all 0.2s;
    }

    .back-nav:hover { 
      background: #dbeafe; 
    }

    .main-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 32px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .main-card h2 {
      font-size: 1.5rem;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .main-card p {
      color: var(--text-muted);
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="?page=home" class="back-nav">
      <i class="fa-solid fa-arrow-left"></i> Kembali ke Dashboard Utama
    </a>
    
    <div class="main-card">
      <h2>Modul 1: Laporan Bulanan RNS</h2>
      <p>Konten atau fungsionalitas utama dari Modul 1 berjalan di area kerja ini.</p>
    </div>
  </div>

</body>
</html>
